aid: grok-me
name: Asgardian Village · Canadian house
description: 'Asgardian Village · Canadian house is a merit-based community of makers ("a Canadian house of makers"
  — hydroponics, 3D-printed modular nodes, veteran outreach, direct-diplomacy doctrine) that publishes an A2A agent
  card for humans and AI agents. The site is a Grok App hosted by xAI on the asgardian-village.grok.me subdomain
  (the registrable domain grok.me belongs to xAI and redirects to grok.com). The only machine-readable surface is
  the A2A agent card at /.well-known/agent-card.json (protocolVersion 0.3.0, three informational skills: Moral Code
  briefing, Barracks path, Forge kit pointer). No OpenAPI, MCP server, llms.txt, OAuth metadata or developer program
  is published, and the card''s declared JSON-RPC url is the website itself, which answers non-HTML requests with
  HTTP 500 — the card is a discovery document, not a served A2A transport.'
